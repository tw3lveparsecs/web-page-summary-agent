# Deploy backend and frontend to Azure Web Apps
#
# Required GitHub secrets:
#   AZURE_CLIENT_ID        — App registration (federated credential) client ID
#   AZURE_TENANT_ID        — Entra ID tenant
#   AZURE_SUBSCRIPTION_ID  — Target subscription

name: Deploy Apps

on:
  workflow_dispatch:

env:
  AZURE_RG: "web-summariser-rg"    # TODO: set your resource group name
  BASE_NAME: "websummariser"         # TODO: set your base name (e.g. websummary)

permissions:
  id-token: write
  contents: read

jobs:
  backend:
    name: Deploy Backend API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Package backend
        run: |
          zip -r backend.zip \
            api.py \
            extractor.py \
            summariser.py \
            main.py \
            prompt.txt \
            requirements.txt \
            startup.sh

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.BASE_NAME }}-api
          package: backend.zip

  frontend:
    name: Deploy Frontend App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build --if-present

      - name: Package frontend
        run: zip -r ../frontend.zip .

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.BASE_NAME }}-web
          package: frontend.zip

  configure:
    name: Configure CORS
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set ALLOWED_ORIGINS on backend
        run: |
          az webapp config appsettings set \
            --name "${{ env.BASE_NAME }}-api" \
            --resource-group "${{ env.AZURE_RG }}" \
            --settings ALLOWED_ORIGINS="https://${{ env.BASE_NAME }}-web.azurewebsites.net"
