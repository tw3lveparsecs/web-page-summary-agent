# Deploy Azure infrastructure using Bicep
#
# All deployment parameters are defined in infra/main.bicepparam.
# Edit that file to configure resource names, Foundry settings, etc.
#
# Required GitHub secrets:
#   AZURE_CLIENT_ID        — App registration (federated credential) client ID
#   AZURE_TENANT_ID        — Entra ID tenant
#   AZURE_SUBSCRIPTION_ID  — Target subscription

name: Deploy Infrastructure

on:
  workflow_dispatch:

env:
  AZURE_RG: "web-summariser-rg"    # TODO: set your resource group name

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep template
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.AZURE_RG }}
          template: infra/main.bicep
          parameters: infra/main.bicepparam
          failOnStdErr: false

      - name: Allow App Service subnet on Foundry firewall
        run: |
          az cognitiveservices account network-rule add \
            --name "${{ steps.deploy.outputs.foundryAccountName }}" \
            --resource-group "${{ steps.deploy.outputs.foundryResourceGroupName }}" \
            --subnet "${{ steps.deploy.outputs.integrationSubnetId }}"
